schema_version: 1

context:
  name: airflow-supervisor
  version: "1.10.4"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/airflow-supervisor/airflow_supervisor-${{ version }}.tar.gz
  sha256: 5e403ecf70e6b76139a9acbc159e450d235e66686ac9be8c3fce0b603f2ff852

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-ha >=1.6.3,<1.7
    - airflow-pydantic >=1.6,<1.7
    - supervisor-pydantic >=1.3,<1.5

tests:
  - python:
      imports:
        - airflow_supervisor
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Supervisor operators and configuration for long-running tasks
  description: Supervisor operators and configuration for long-running tasks
  homepage: https://github.com/airflow-laminar/airflow-supervisor
  repository: https://github.com/airflow-laminar/airflow-supervisor

extra:
  recipe-maintainers:
    - timkpaine
