schema_version: 1

context:
  name: airflow-supervisor
  version: "1.11.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/airflow-supervisor/airflow_supervisor-${{ version }}.tar.gz
  sha256: 29616c832bb606776422f5224089fcf74bbf481631da0c54c0fa4570355b0fea

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-ha >=1.6.5,<1.7
    - airflow-pydantic >=1.7.0,<1.8
    - supervisor-pydantic >=1.5.1,<1.6

tests:
  - python:
      imports:
        - airflow_supervisor
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Supervisor operators and configuration for long-running tasks
  description: Supervisor operators and configuration for long-running tasks
  homepage: https://github.com/airflow-laminar/airflow-supervisor
  repository: https://github.com/airflow-laminar/airflow-supervisor

extra:
  recipe-maintainers:
    - timkpaine
